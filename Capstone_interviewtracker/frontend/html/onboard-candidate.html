<!DOCTYPE html>
<html>
<head>
  <title>Onboard Candidate - Interview Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages/hr-dashboard.css">
</head>
<body class="page-dashboard page-hr">
<div class="dashboard-shell">
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">☰</button>
    <nav class="sidebar-nav">
      <a href="hr-main-dashboard.html" class="sidebar-link jd-link">Dashboard</a>
      <a href="candidates.html" class="sidebar-link candidates-link">Candidates</a>
      <a href="onboard-candidate.html" class="sidebar-link onboard-link active">Onboard Candidate</a>
      <a href="hr-dashboard.html#panelMembersSection" class="sidebar-link panel-link">Panel Members</a>
      <a href="hr-feedback.html" class="sidebar-link feedback-link">Feedback</a>
    </nav>
    <div class="sidebar-footer">
      <a href="login.html" onclick="logout()" class="logout-link sidebar-link">Logout</a>
    </div>
  </aside>

  <main class="content-area">
    <div class="container">
      <div class="header">
        <div>
          <h2>HR Dashboard</h2>
          <p class="pipeline-note">Onboard candidates for final review.</p>
        </div>
        <div class="header-actions">
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <div class="toolbar-field">
            <input id="onboardSearch" type="text" placeholder="Search by name, email, phone, job title...">
          </div>
        </div>
        <div class="toolbar-right">
          <button class="secondary-btn" type="button" onclick="clearOnboardFilters()">Clear</button>
        </div>
      </div>

      <div id="onboardList">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading candidates...</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/onboard-candidate.js"></script>
<script>
function toggleSidebar() {
  const shell = document.querySelector('.dashboard-shell');
  shell.classList.toggle('sidebar-collapsed');
}
</script>
</body>
</html>
