<!DOCTYPE html>
<html>
<head>
  <title>Onboard Candidate - Interview Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages/hr-dashboard.css">
</head>
<body class="page-dashboard">
<div class="dashboard-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">IT</div>
    <div class="sidebar-title">HR Dashboard</div>
    <nav class="sidebar-nav">
      <a href="jd.html">Job Descriptions</a>
      <a href="hr-dashboard.html">Candidates</a>
      <a class="active" href="onboard-candidate.html">Onboard Candidate</a>
      <a href="hr-dashboard.html#panelMembersSection">Panel Members</a>
      <a href="hr-feedback.html">Feedback</a>
      <a href="login.html" onclick="logout()">Logout</a>
    </nav>
  </aside>

  <main class="content-area">
    <div class="container">
      <div class="header">
        <div>
          <h2>Onboard Candidate</h2>
          <p class="pipeline-note">Review HR round candidates and make the final decision.</p>
        </div>
        <div class="header-actions">
          <button class="icon-btn" type="button" onclick="toggleSidebar()" aria-label="Toggle sidebar">☰</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <div class="toolbar-field">
            <input id="onboardSearch" type="text" placeholder="Search by name, email, phone, job title...">
          </div>
        </div>
        <div class="toolbar-right">
          <button class="secondary-btn" type="button" onclick="clearOnboardFilters()">Clear</button>
        </div>
      </div>

      <div id="onboardList">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading candidates...</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/onboard-candidate.js"></script>
</body>
</html>
