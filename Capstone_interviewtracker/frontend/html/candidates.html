<!DOCTYPE html>
<html>
<head>
  <title>Candidates - Interview Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages/hr-dashboard.css">
</head>
<body class="page-dashboard page-hr">
<div class="dashboard-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">HR Dashboard</div>
    <nav class="sidebar-nav">
      <a href="hr-main-dashboard.html" class="sidebar-link jd-link">Dashboard</a>
      <a href="candidates.html" class="sidebar-link candidates-link active">Candidates</a>
      <a href="onboard-candidate.html" class="sidebar-link onboard-link">Onboard Candidate</a>
      <a href="hr-dashboard.html#panelMembersSection" class="sidebar-link panel-link">Panel Members</a>
      <a href="hr-feedback.html" class="sidebar-link feedback-link">Feedback</a>
    </nav>
    <div class="sidebar-footer">
      <a href="login.html" onclick="logout()" class="logout-link sidebar-link">Logout</a>
    </div>
  </aside>

  <main class="content-area">
    <div class="container">
      <div class="header">
        <div>
          <h2>All Candidates</h2>
          <p class="pipeline-note">Manage all candidates and track interview progression.</p>
        </div>
        <div class="header-actions">
          <button class="secondary-btn" onclick="window.location.href='hr-main-dashboard.html'">HR Dashboard</button>
          <button class="icon-btn" type="button" onclick="toggleSidebar()" aria-label="Toggle sidebar">☰</button>
          <button onclick="window.location.href='jd.html'">Create JD</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <div class="toolbar-field">
            <input id="candidateSearch" type="text" placeholder="Search by name, email, phone, job title...">
          </div>
        </div>
        <div class="toolbar-right">
          <select id="stageFilter" aria-label="Filter by stage">
            <option value="ALL">All stages</option>
            <option value="PROFILING">Profiling</option>
            <option value="SCREENING">Screening</option>
            <option value="L1_TECH">L1</option>
            <option value="L2_TECH">L2</option>
            <option value="HR_ROUND">HR</option>
            <option value="SELECTED">Selected</option>
            <option value="REJECTED">Rejected</option>
          </select>
          <button class="secondary-btn" type="button" onclick="clearCandidateFilters()">Clear</button>
        </div>
      </div>

      <div id="candidateList">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading candidates...</p>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Assign Panel Modal -->
<div id="assignPanelModal" class="modal-backdrop is-hidden" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="assignPanelTitle">
    <div class="modal-header">
      <h3 id="assignPanelTitle">Assign Panel Members</h3>
      <button class="secondary-btn" type="button" onclick="closeAssignPanel()">Close</button>
    </div>

    <div class="modal-body">
      <p class="pipeline-note">Select 1 or 2 panel members and schedule interview details.</p>

      <div class="form-row">
        <div class="input-group">
          <label for="panelEmail1">Panel member 1 (required)</label>
          <select id="panelEmail1"></select>
        </div>
        <div class="input-group">
          <label for="panelEmail2">Panel member 2 (optional)</label>
          <select id="panelEmail2"></select>
        </div>
      </div>

      <div class="form-row">
        <div class="input-group">
          <label for="interviewDate">Interview Date (required)</label>
          <input type="date" id="interviewDate" required>
        </div>
        <div class="input-group">
          <label for="interviewTime">Interview Time (required)</label>
          <input type="time" id="interviewTime" required>
        </div>
      </div>

      <div class="form-row">
        <div class="input-group full-width">
          <label for="focusArea">Focus Area (optional)</label>
          <input type="text" id="focusArea" placeholder="e.g., JavaScript, System Design, Database">
        </div>
      </div>

      <div class="form-row">
        <div class="input-group full-width">
          <label for="interviewNotes">Interview Notes (optional)</label>
          <textarea id="interviewNotes" rows="3" placeholder="Additional notes for panel members..."></textarea>
        </div>
      </div>

      <div id="assignPanelError" class="alert alert-error is-hidden"></div>
    </div>

    <div class="modal-actions">
      <button id="assignPanelSubmitBtn" type="button" onclick="submitAssignPanel()">Assign & Send Emails</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/candidates.js"></script>
<script>
function toggleSidebar() {
  const shell = document.querySelector('.dashboard-shell');
  shell.classList.toggle('sidebar-collapsed');
}
</script>
</body>
</html>
