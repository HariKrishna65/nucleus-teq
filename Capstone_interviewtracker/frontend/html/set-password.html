<!DOCTYPE html>
<html>
<head>
  <title>Set Password - Interview Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages/set-password.css">
</head>
<body class="page-auth">

<div class="container">
  <div class="icon">Security</div>
  <h2>Set Your Password</h2>
  <p class="message">Create a secure password to complete your registration.</p>

  <div class="password-requirements">
    <h4>Password Requirements:</h4>
    <ul>
      <li>At least 8 characters</li>
      <li>One uppercase letter</li>
      <li>One lowercase letter</li>
      <li>One number</li>
      <li>One special character (!@#$%^&*)</li>
    </ul>
  </div>

  <div class="input-group">
    <label for="newPassword">New Password</label>
    <div class="password-wrapper">
      <input id="newPassword" type="password" placeholder="Enter your password">
      <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">👁</button>
    </div>
    <div class="password-strength">
      <div class="strength-bar">
        <div class="strength-fill" id="strengthFill"></div>
      </div>
      <div class="strength-text" id="strengthText"></div>
    </div>
  </div>

  <div class="input-group">
    <label for="confirmPassword">Confirm Password</label>
    <div class="password-wrapper">
      <input id="confirmPassword" type="password" placeholder="Re-enter your password">
      <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">👁</button>
    </div>
  </div>

  <button onclick="setPassword()">Set Password</button>
</div>

<script>
const BASE_URL = "http://localhost:8080";

// Get token from URL
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
  showError("Invalid password reset link. Please request a new link.");
}

// Password strength checker
document.getElementById("newPassword").addEventListener("input", function() {
  const password = this.value;
  const strengthFill = document.getElementById("strengthFill");
  const strengthText = document.getElementById("strengthText");
  
  let strength = 0;
  if (password.length >= 8) strength++;
  if (/[A-Z]/.test(password)) strength++;
  if (/[a-z]/.test(password)) strength++;
  if (/[0-9]/.test(password)) strength++;
  if (/[!@#$%^&*]/.test(password)) strength++;
  
  strengthFill.className = "strength-fill";
  if (strength <= 2) {
    strengthFill.classList.add("strength-weak");
    strengthText.textContent = "Weak";
    strengthText.style.color = "var(--danger)";
  } else if (strength <= 3) {
    strengthFill.classList.add("strength-medium");
    strengthText.textContent = "Medium";
    strengthText.style.color = "var(--warning)";
  } else if (strength >= 4) {
    strengthFill.classList.add("strength-strong");
    strengthText.textContent = "Strong";
    strengthText.style.color = "var(--success)";
  }
});

function setPassword() {
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  
  // Validate
  if (!token) {
    showError("Invalid token. Please request a new password link.");
    return;
  }
  
  if (!newPassword) {
    showAlert("Please enter a password", "error");
    return;
  }
  
  if (newPassword.length < 8) {
    showAlert("Password must be at least 8 characters", "error");
    return;
  }

  if (!/[A-Z]/.test(newPassword)) {
    showAlert("Password must include at least one uppercase letter", "error");
    return;
  }

  if (!/[a-z]/.test(newPassword)) {
    showAlert("Password must include at least one lowercase letter", "error");
    return;
  }

  if (!/[0-9]/.test(newPassword)) {
    showAlert("Password must include at least one number", "error");
    return;
  }

  if (!/[!@#$%^&*()_+\\-=[\\]{};':\"\\\\|,.<>/?]/.test(newPassword)) {
    showAlert("Password must include at least one special character", "error");
    return;
  }
  
  if (newPassword !== confirmPassword) {
    showAlert("Passwords do not match", "error");
    return;
  }

  showLoading(true);

  fetch(BASE_URL + "/auth/set-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ 
      token: token, 
      newPassword: newPassword 
    })
  })
  .then(res => res.text())
  .then(data => {
    showLoading(false);
    if (data.includes("success") || data.includes("Login")) {
      showSuccess("Password set successfully! You can now login.");
      setTimeout(() => window.location.href = "login.html", 2000);
    } else {
      showAlert(data, "error");
    }
  })
  .catch(err => {
    showLoading(false);
    showAlert("Failed to set password. Please try again.", "error");
  });
}

function showLoading(show) {
  const btn = document.querySelector("button");
  if (show) {
    btn.innerHTML = '<span class="spinner"></span> Setting Password...';
    btn.disabled = true;
  } else {
    btn.textContent = "Set Password";
    btn.disabled = false;
  }
}

function showAlert(message, type) {
  const existing = document.querySelector(".alert");
  if (existing) existing.remove();

  const alert = document.createElement("div");
  alert.className = `alert alert-${type}`;
  alert.textContent = message;

  const container = document.querySelector(".container");
  container.insertBefore(alert, container.firstChild);
}

function showError(message) {
  document.querySelector(".icon").textContent = "Error";
  document.querySelector("h2").textContent = "Error";
  document.querySelector(".message").textContent = message;
  document.querySelector("button").style.display = "none";
}

function showSuccess(message) {
  document.querySelector(".icon").textContent = "Success";
  document.querySelector("h2").textContent = "Success!";
  document.querySelector(".message").textContent = message;
  document.querySelector("button").style.display = "none";
}

function togglePassword(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;
  const isHidden = input.type === "password";
  input.type = isHidden ? "text" : "password";
  btn.textContent = isHidden ? "🙈" : "👁";
}

// Enter key support
document.addEventListener("keypress", function(e) {
  if (e.key === "Enter") setPassword();
});
</script>

</body>
</html>
