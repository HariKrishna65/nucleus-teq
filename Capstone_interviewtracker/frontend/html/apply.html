<!DOCTYPE html>
<html>
<head>
  <title>Apply for Job - Interview Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages/apply.css">
</head>
<body class="page-dashboard page-candidate">

<div class="dashboard-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">IT</div>
    <div class="sidebar-title">Candidate</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">My Applications</a>
      <a class="active" href="apply.html">Apply Jobs</a>
      <a href="jd.html?view=available">Available Jobs</a>
      <a href="login.html" onclick="logout()" class="logout-link">Logout</a>
    </nav>
  </aside>

  <main class="content-area">
    <div class="container">
      <div class="header">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">U</div>
          <div class="user-details">
            <h3 id="userName">User</h3>
            <p>Candidate</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" type="button" onclick="toggleSidebar()" aria-label="Toggle sidebar">☰</button>
          <a class="btn apply-more-btn" href="dashboard.html">My Applications</a>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
      </div>

  <div class="jd-info" id="selectedJdInfo">
    <h4>Selected Position</h4>
    <p id="jdTitle">Select a job from the list below</p>
  </div>

  <div class="input-group">
    <label for="jdSelect">Select Job</label>
    <select id="jdSelect" onchange="updateJdInfo()">
      <option value="">-- Select a job --</option>
    </select>
  </div>

  <div class="input-group">
    <label for="phone">Phone Number</label>
    <input id="phone" type="tel" placeholder="Enter your phone number">
  </div>

  <div class="input-group">
    <label for="experience">Years of Experience</label>
    <input id="experience" type="number" min="0" max="30" placeholder="Enter years of experience">
  </div>

  <div class="input-group">
    <label>Resume (PDF)</label>
    <div class="file-input-wrapper">
      <input type="file" id="resume" accept=".pdf,application/pdf" onchange="updateFileName()">
      <div class="file-display">
        <div class="icon">Resume File</div>
        <p>Click to upload or drag and drop</p>
        <p class="file-hint-text">PDF only (Max 5MB)</p>
        <div class="file-name" id="fileName"></div>
      </div>
    </div>
  </div>

      <button onclick="applyJob()">Submit Application</button>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/apply.js"></script>
</body>
</html>
