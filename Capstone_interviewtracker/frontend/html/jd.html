<!DOCTYPE html>
<html>
<head>
  <title>Job Descriptions - Interview Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages/jd.css">
</head>
<body class="page-workflow">

<div class="container">
  <div class="header">
    <h2>Job Opportunities</h2>
    <div class="header-actions">
      <button id="hrDashboardBtn" class="back-btn is-hidden" onclick="window.location.href='hr-dashboard.html'">HR Dashboard</button>
      <button id="availableJobsBtn" class="back-btn is-hidden" onclick="setView('available')">Available Jobs</button>
      <button id="createJobBtn" class="back-btn is-hidden" onclick="setView('create')">Create Job</button>
      <button class="back-btn" onclick="window.location.href='index.html'">Home</button>
    </div>
  </div>

  <!-- CREATE JD FORM (HR ONLY) -->
  <div id="jdForm" class="create-jd-form is-hidden">
    <h3>Create New Job</h3>
    <div class="form-row">
      <div class="input-group">
        <label for="title">Job Title</label>
        <input id="title" placeholder="e.g., Software Engineer">
      </div>
      <div class="input-group">
        <label for="experienceMin">Min Experience (years)</label>
        <input id="experienceMin" type="number" min="0" placeholder="e.g., 2">
      </div>
      <div class="input-group">
        <label for="experienceMax">Max Experience (years)</label>
        <input id="experienceMax" type="number" min="0" placeholder="e.g., 5">
      </div>
    </div>
    <div class="input-group">
      <label for="description">Job Description</label>
      <textarea id="description" rows="3" placeholder="10 to 50 words describing the role and responsibilities"></textarea>
    </div>
    <div class="input-group">
      <label for="skills">Required Skills</label>
      <input id="skills" placeholder="e.g., Java, Spring, React">
    </div>
    <div class="form-row">
      <div class="input-group">
        <label for="salaryMin">Min Salary</label>
        <input id="salaryMin" type="number" min="0" placeholder="e.g., 400000">
      </div>
      <div class="input-group">
        <label for="salaryMax">Max Salary</label>
        <input id="salaryMax" type="number" min="0" placeholder="e.g., 900000">
      </div>
    </div>
    <button onclick="createJD()">Post Job</button>
  </div>

  <div class="jobs-header">
    <h3 id="jobsTitle">Available Positions</h3>
    <div class="jobs-subtitle" id="jobsSubtitle">Browse open roles and apply.</div>
  </div>
  <div class="jobs-grid" id="jdList">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading jobs...</p>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/jd.js"></script>
</body>
</html>
