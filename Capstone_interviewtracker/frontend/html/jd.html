<!DOCTYPE html>
<html>
<head>
  <title>Job Descriptions - Interview Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages/jd.css">
</head>
<body class="page-workflow">

<div class="container">
  <div class="header">
    <h2>Job Opportunities</h2>
    <div class="header-actions">
      <button id="hrDashboardBtn" class="back-btn is-hidden" onclick="window.location.href='hr-dashboard.html'">HR Dashboard</button>
      <button id="availableJobsBtn" class="back-btn is-hidden" onclick="setView('available')">Available Jobs</button>
      <button id="createJobBtn" class="back-btn is-hidden" onclick="setView('create')">Create Job</button>
      <button class="back-btn" onclick="window.location.href='index.html'">Home</button>
    </div>
  </div>

  <!-- CREATE JD FORM (HR ONLY) -->
  <div id="jdForm" class="create-jd-form is-hidden">
    <h3>Create New Job</h3>
    <div class="form-row">
      <div class="input-group">
        <label for="title">Job Title <span class="required">*</span></label>
        <input id="title" type="text" required minlength="3" maxlength="100" 
               placeholder="e.g., Software Engineer" 
               title="Job title must be between 3 and 100 characters">
      </div>
      <div class="input-group">
        <label for="experienceMin">Min Experience (years) <span class="required">*</span></label>
        <input id="experienceMin" type="number" min="0" max="50" step="0.5" required
               placeholder="e.g., 2" 
               title="Minimum experience must be between 0 and 50 years">
      </div>
      <div class="input-group">
        <label for="experienceMax">Max Experience (years) <span class="required">*</span></label>
        <input id="experienceMax" type="number" min="0" max="50" step="0.5" required
               placeholder="e.g., 5" 
               title="Maximum experience must be between 0 and 50 years">
      </div>
    </div>
    <div class="input-group">
      <label for="description">Job Description <span class="required">*</span></label>
      <textarea id="description" rows="4" minlength="50" maxlength="500" required
                placeholder="Describe the role, responsibilities, and requirements (50-500 characters)"
                title="Job description must be between 50 and 500 characters"></textarea>
      <small class="help-text">Provide a detailed description of the role and responsibilities</small>
    </div>
    <div class="input-group">
      <label for="skills">Required Skills <span class="required">*</span></label>
      <input id="skills" type="text" required minlength="5" maxlength="200"
             placeholder="e.g., Java Spring React" 
             title="Skills must be between 5 and 200 characters">
      <small class="help-text">Enter skills separated by spaces (e.g., Java Spring React)</small>
    </div>
    <div class="form-row">
      <div class="input-group">
        <label for="salaryMin">Min Salary (Annual) <span class="required">*</span></label>
        <input id="salaryMin" type="number" min="100000" max="5000000" step="10000" required
               placeholder="e.g., 400000" 
               title="Minimum salary must be between ₹1,00,000 and ₹50,00,000">
        <small class="help-text">Enter annual salary in rupees</small>
      </div>
      <div class="input-group">
        <label for="salaryMax">Max Salary (Annual) <span class="required">*</span></label>
        <input id="salaryMax" type="number" min="100000" max="5000000" step="10000" required
               placeholder="e.g., 900000" 
               title="Maximum salary must be between ₹1,00,000 and ₹50,00,000">
        <small class="help-text">Enter annual salary in rupees</small>
      </div>
    </div>
    <button onclick="createJD()">Post Job</button>
  </div>

  <div class="jobs-header">
    <h3 id="jobsTitle">Available Positions</h3>
    <div class="jobs-subtitle" id="jobsSubtitle">Browse open roles and apply.</div>
  </div>
  <div class="jobs-grid" id="jdList">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading jobs...</p>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/jd.js"></script>
</body>
</html>
