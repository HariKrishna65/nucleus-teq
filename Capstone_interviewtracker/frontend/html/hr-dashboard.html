<!DOCTYPE html>
<html>
<head>
  <title>HR Dashboard - Interview Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages/hr-dashboard.css">
</head>
<body class="page-dashboard">

<div class="container">
  <div class="header">
    <h2>HR Pipeline Dashboard</h2>
    <div class="header-actions">
      <button class="secondary-btn" onclick="window.location.href='jd.html'">Job Descriptions</button>
      <button class="secondary-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-value" id="totalCount">0</div><div>Total</div></div>
    <div class="stat-card"><div class="stat-value" id="profilingCount">0</div><div>Profiling</div></div>
    <div class="stat-card"><div class="stat-value" id="screeningCount">0</div><div>Screening</div></div>
    <div class="stat-card"><div class="stat-value" id="l1Count">0</div><div>L1</div></div>
    <div class="stat-card"><div class="stat-value" id="l2Count">0</div><div>L2</div></div>
    <div class="stat-card"><div class="stat-value" id="hrCount">0</div><div>HR</div></div>
    <div class="stat-card"><div class="stat-value" id="selectedCount">0</div><div>Selected</div></div>
    <div class="stat-card"><div class="stat-value" id="rejectedCount">0</div><div>Rejected</div></div>
  </div>

  <p class="pipeline-note">Manage stage progression, view candidate progress, and review latest panel feedback.</p>

  <div id="candidateList">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading candidates...</p>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/hr-dashboard.js"></script>
</body>
</html>
